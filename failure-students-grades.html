<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف درجات الطلاب المفصل</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .result-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            page-break-after: always;
        }

        .result-section:last-child {
            page-break-after: auto;
        }

        /* تنسيق الجدول */
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .table-custom th,
        .table-custom td {
            border: 1px solid #dee2e6;
            padding: 8px 10px;
            text-align: center;
            vertical-align: middle;
        }

        .table-custom th {
            background-color: #d3d3d3 !important;
            color: #000;
            font-weight: 700;
        }

        .name-cell {
            text-align: right !important;
            padding-right: 15px !important;
            font-weight: 600;
        }

        .status-passed {
            color: #198754;
            font-weight: bold;
        }

        .status-failed {
            color: #dc3545;
            font-weight: bold;
        }

        .status-absent {
            color: #6c757d;
            font-weight: bold;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body,
            html {
                width: 100%;
                height: auto;
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .container {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 10px !important;
                /* تقليل الهوامش إلى 10px */
            }

            /* إخفاء العناصر التي تحمل كلاس d-none حتى في الطباعة */
            .result-section.d-none {
                display: none !important;
            }

            .result-section {
                /* إزالة !important من display للسماح للقواعد الأخرى بالعمل */
                display: block;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;

                /* فاصل صفحات صارم */
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                position: static !important;
                margin-top: 20px !important;
            }

            /* إخفاء الصفحة الفارغة الأخيرة إذا أمكن */
            .result-section:not(.d-none):last-of-type {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            .table-responsive {
                overflow: visible !important;
            }

            .table-custom th {
                -webkit-print-color-adjust: exact;
                background-color: #d3d3d3 !important;
            }

            tr,
            td {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-inside: avoid;
            }

            /* تحسين ظهور الحالات عند الطباعة (أسود عريض) */
            .status-passed,
            .status-failed,
            .status-absent {
                color: black !important;
                font-weight: 900 !important;
                /* عريض جداً */
            }
        }
    </style>
</head>

<body>

    <div class="result-view container mt-3">
        <div class="text-center no-print mb-4 d-flex justify-content-center align-items-center gap-2 flex-wrap">
            <button onclick="window.print()" class="btn btn-success">🖨️ طباعة</button>

            <!-- فلتر الفرقة -->
            <select id="levelFilter" class="form-select w-auto d-inline-block" onchange="filterGrades()">
                <option value="all">عرض الجميع</option>
                <option value="22">الفرقة الثانية</option>
                <option value="23">الفرقة الثالثة</option>
                <option value="24">الفرقة الرابعة</option>
            </select>

            <button onclick="goBack()" class="btn btn-secondary">← العودة للنتائج</button>
        </div>

        <div id="grades-container">
            <!-- سيتم ملء المحتوى هنا -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAllGrades();
        });

        function goBack() {
            window.location.href = 'failure-statistics.html';
        }

        // دالة الفلترة
        function filterGrades() {
            const selectedLevel = document.getElementById('levelFilter').value;
            const sections = document.querySelectorAll('.result-section');

            sections.forEach(section => {
                const sectionLevel = section.getAttribute('data-level');
                if (selectedLevel === 'all' || sectionLevel === selectedLevel) {
                    section.classList.remove('d-none'); // إظهار
                } else {
                    section.classList.add('d-none'); // إخفاء باستخدام كلاس البوتستراب
                }
            });
        }

        function loadAllGrades() {
            const statsData = localStorage.getItem('failureStatistics');
            if (!statsData) {
                document.getElementById('grades-container').innerHTML = '<div class="alert alert-warning text-center">لا توجد بيانات محفوظة. يرجى رفع الملفات أولاً من الصفحة الرئيسية.</div>';
                return;
            }

            try {
                const results = JSON.parse(statsData);

                if (!results || results.length === 0) {
                    document.getElementById('grades-container').innerHTML = '<div class="alert alert-info text-center">لا توجد سجلات لعرضها.</div>';
                    return;
                }

                const container = document.getElementById('grades-container');
                container.innerHTML = '';

                results.forEach((result) => {
                    // إنشاء محتوى الـ HTML
                    const htmlContent = renderGradesTableHtml(result);

                    // إضافته للـ container
                    container.insertAdjacentHTML('beforeend', htmlContent);

                    // الوصول للعنصر المضاف حديثاً لإضافة data-level
                    const lastSection = container.lastElementChild;
                    if (lastSection) {
                        lastSection.setAttribute('data-level', result.level);
                    }
                });

            } catch (error) {
                console.error(error);
                document.getElementById('grades-container').innerHTML = '<div class="alert alert-danger text-center">حدث خطأ في قراءة البيانات.</div>';
            }
        }

        function renderGradesTableHtml(result) {
            const courseName = result.courseName || 'غير محدد';
            let cleanCourseName = courseName.replace(/^(تخلف\s*-\s*|تخلف\s+)/, '').trim();
            const academicYear = result.academicYear || '';
            const levelNames = { '22': 'الفرقة الثانية', '23': 'الفرقة الثالثة', '24': 'الفرقة الرابعة' };
            const levelName = levelNames[result.level] || `الفرقة ${result.level}`;

            let fullTitle = academicYear
                ? `كشف درجات تخلف - ${cleanCourseName} - ${levelName} - ${academicYear}`
                : `كشف درجات تخلف - ${cleanCourseName} - ${levelName}`;

            let shortCourseName = cleanCourseName
                .split(/\s+-\s+|(?<=\p{L})\s+(?=\d{4})/u)[0]
                .trim();

            let html = `
                <div class="result-section">
                    <div class="text-center mb-3">
                        <h4 class="fw-bold fs-4">${fullTitle}</h4>
                    </div>

                    <!-- المربع الإضافي -->
                    <div class="text-center mb-4 p-2" style="border: 2px solid #000; border-radius: 5px; width: fit-content; margin: 0 auto; min-width: 300px;">
                        <h5 class="mb-0 fw-bold">تخلفات طلاب ${levelName} لمقرر ${shortCourseName}</h5>
                    </div>

                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th width="5%">م</th>
                                    <th width="15%">رقم الجلوس</th>
                                    <th width="45%">اسم الطالب</th>
                                    <th width="15%">الدرجة</th>
                                    <th width="20%">الحالة</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            if (result.students && result.students.length > 0) {
                // ترتيب الطلاب حسب رقم الجلوس
                result.students.sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));

                result.students.forEach((student, i) => {
                    let statusClass = '';
                    let statusText = '';
                    let scoreText = student.score;
                    let rowStyle = '';

                    if (student.status === 'passed') {
                        statusClass = 'status-passed';
                        statusText = 'ناجح';
                    } else if (student.status === 'failed') {
                        statusClass = 'status-failed';
                        statusText = 'راسب';
                    } else {
                        statusClass = 'status-absent fw-bold';
                        statusText = 'غياب';
                        scoreText = 'غياب';
                        rowStyle = 'background-color: #ffe066 !important;';
                    }

                    // تطبيق التلوين الأصفر فقط لخلية الدرجة والحالة في حالة الغياب
                    let cellStyle = student.status === 'absent' ? 'background-color: #ffe066 !important;' : '';

                    html += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${student.seatNo}</td>
                            <td class="name-cell">${student.name}</td>
                            <td class="fw-bold" style="${cellStyle}">${scoreText}</td>
                            <td class="${statusClass}" style="${cellStyle}">${statusText}</td>
                        </tr>
                    `;
                });
            } else {
                html += `<tr><td colspan="5" class="py-3 text-center text-muted">لا توجد بيانات طلاب. أعد رفع الملفات.</td></tr>`;
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            return html;
        }
    </script>
</body>

</html>
