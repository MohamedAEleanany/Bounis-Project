<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج طلب بونص</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Storage Helper -->
    <script src="storage-helper.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f2f5;
        }

        .input-view {
            transition: all 0.3s ease;
        }

        .form-container {
            background-color: white;
            padding: 3rem;
            border-radius: 10px;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* A4 Paper Style */
        .page-container {
            display: none;
            /* Hidden by default */
            width: 210mm;
            height: 297mm;
            padding: 10mm;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            border: 1px solid #d3d3d3;
            position: relative;
            box-sizing: border-box;
            color: black;
            font-family: 'Simplified Arabic', 'Traditional Arabic', serif;
        }

        .border-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid #000080;
            padding: 4px;
            box-sizing: border-box;
        }

        .border-inner-thick {
            width: 100%;
            height: 100%;
            border: 4px solid #000080;
            position: relative;
            box-sizing: border-box;
            padding: 30px 40px;
        }

        .corner-box {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid #000080;
            background: white;
            z-index: 10;
        }

        .p-tl {
            top: -2px;
            right: -2px;
        }

        .p-tr {
            top: -2px;
            left: -2px;
        }

        .p-bl {
            bottom: -2px;
            right: -2px;
        }

        .p-br {
            bottom: -2px;
            left: -2px;
        }

        .corner-box::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: #000080;
            margin: 3px;
        }

        /* Header Style */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            width: 100%;
        }

        .header-right {
            text-align: center;
            font-weight: bold;
            font-size: 12pt;
            /* Reduced from 14pt */
            line-height: 1.2;
        }

        .header-logo {
            text-align: left;
        }

        .header-logo img {
            max-width: 80px;
            /* Reduced from 100px */
            height: auto;
        }

        /* Word Document Content Styles */
        .word-content {
            font-family: 'Simplified Arabic', 'Traditional Arabic', serif !important;
            font-size: 16pt;
            font-weight: bold !important;
            line-height: 1.6;
            text-align: justify;
        }

        .word-header {
            font-family: 'Simplified Arabic', 'Traditional Arabic', serif !important;
            font-weight: bold;
            font-size: 22pt;
        }

        .variable-text {
            font-weight: bold;
            padding: 0 5px;
        }

        /* Main Request Text Class */
        .request-main-text {
            font-family: 'Simplified Arabic', 'Traditional Arabic', serif !important;
            font-size: 16pt;
            font-weight: bold;
            line-height: 1.8;
            text-indent: 50px;
            margin-bottom: 30px;
        }

        .signature-section {
            margin-top: 60px;
            display: flex;
            justify-content: flex-end;
            padding-left: 20px;
            font-family: 'Simplified Arabic', 'Traditional Arabic', serif !important;
        }

        .signature-block {
            text-align: center;
            font-size: 18pt;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-spacer {
            height: 20px;
        }

        .preview-toolbar {
            width: 210mm;
            margin: 0 auto 20px auto;
            display: none;
            justify-content: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #f0f2f5;
            padding: 10px 0;
        }

        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            body {
                background: white;
                margin: 0;
                padding: 0;
                width: 210mm;
                height: 297mm;
            }

            .no-print,
            .input-view,
            .preview-toolbar {
                display: none !important;
            }

            .page-container {
                display: block !important;
                border: none;
                margin: 0 !important;
                padding: 10mm !important;
                /* Increased from 15mm to create smaller border/more whitespace */
                width: 210mm !important;
                height: 297mm !important;
                box-sizing: border-box !important;
                overflow: hidden;
            }

            .border-frame {
                width: 100% !important;
                height: 100% !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border-color: #000080 !important;
            }

            .border-inner-thick {
                border-color: #000080 !important;
            }

            .corner-box {
                border-color: #000080 !important;
                background-color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .corner-box::after {
                background-color: #000080 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Input Form Section -->
    <div class="container input-view">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h3 class="text-center mb-5 fw-bold text-primary">إنشاء نموذج طلب بونص</h3>
                    <form id="bonusForm">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">1. اسم المسؤول (متلقي الطلب)</label>
                                <input type="text" class="form-control" id="recipientName" required
                                    placeholder="أدخل اسم المسؤول">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">2. وظيفة المسؤول (الصفة)</label>
                                <input type="text" class="form-control" id="recipientTitle" required
                                    placeholder="أدخل وظيفة المسؤول">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">3. عدد درجات البونص</label>
                            <input type="text" class="form-control" id="bonusDegrees" required
                                placeholder="أدخل عدد الدرجات">
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">4. الشعبة</label>
                                <select class="form-select" id="section" required onchange="updateLevelOptions()">
                                    <option value="" selected disabled>اختر الشعبة</option>
                                    <option value="علوم حاسب (س.م)">علوم حاسب (س.م)</option>
                                    <option value="علوم الحاسب">علوم الحاسب</option>
                                    <option value="نظم معلومات الأعمال">نظم معلومات الأعمال</option>
                                    <option value="نظم المعلومات الإدارية">نظم معلومات الإدارية</option>
                                    <option value="المحاسبة المعدلة">المحاسبة المعدلة</option>
                                    <option value="المحاسبة والمراجعة">المحاسبة والمراجعة</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">5. الفرقة / المستوى</label>
                                <select class="form-select" id="level" required>
                                    <option value="" selected disabled>اختر الفرقة / المستوى</option>
                                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                                    <option value="المستوى الأول">المستوى الأول</option>
                                    <option value="المستوى الثاني">المستوى الثاني</option>
                                    <option value="المستوى الثالث">المستوى الثالث</option>
                                    <option value="المستوى الرابع">المستوى الرابع</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">6. نوع الاختبار</label>
                            <select class="form-select" id="examType" required>
                                <option value="" selected disabled>اختر نوع الاختبار</option>
                                <option value="منتصف الفصل الدراسي الاول">منتصف الفصل الدراسي الاول</option>
                                <option value="نهاية الفصل الدراسي الاول">نهاية الفصل الدراسي الاول</option>
                                <option value="منتصف الفصل الدراسي الثاني">منتصف الفصل الدراسي الثاني</option>
                                <option value="نهاية الفصل الدراسي الثاني">نهاية الفصل الدراسي الثاني</option>
                                <option value="تخلفات الفصل الدراسي الاول">تخلفات الفصل الدراسي الاول</option>
                                <option value="تخلفات الفصل الدراسي الثاني">تخلفات الفصل الدراسي الثاني</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">7. اسم المقرر</label>
                            <input type="text" class="form-control" id="courseName" required
                                placeholder="أدخل اسم المقرر">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">8. العام الأكاديمي</label>
                            <select class="form-select" id="academicYear" required>
                                <option value="2025-2026">2025-2026</option>
                                <option value="2026-2027">2026-2027</option>
                                <option value="2027-2028">2027-2028</option>
                                <option value="2028-2029">2028-2029</option>
                                <option value="2029-2030">2029-2030</option>
                                <option value="2030-2031">2030-2031</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">9.أ اسم دكتور المقرر</label>
                            <input type="text" class="form-control" id="profName" required
                                placeholder="اسم استاذ المقرر">
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold">9.ب اسم استاذ ثاني للمقرر (اختياري)</label>
                            <input type="text" class="form-control" id="profName2"
                                placeholder="اختياري - يظهر تحت الاسم الأول">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="index.html" class="btn btn-secondary px-4">
                                عودة للرئيسية
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                معاينة النموذج
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions Toolbar (Visible only in View Mode) -->
    <div class="d-flex preview-toolbar no-print" id="actionButtons">
        <button class="btn btn-secondary shadow" id="backBtn">
            ✏️ تعديل البيانات
        </button>
        <button class="btn btn-success shadow" id="downloadWordBtn">
            💾 تحميل Word
        </button>
        <button class="btn btn-primary shadow" id="printBtn">
            🖨️ طباعة
        </button>
    </div>

    <!-- Word Preview Section -->
    <div id="wordPreview" class="page-container">
        <!-- New Border Frame -->
        <div class="border-frame">
            <!-- Corners -->
            <div class="corner-box p-tl"></div>
            <div class="corner-box p-tr"></div>
            <div class="corner-box p-bl"></div>
            <div class="corner-box p-br"></div>

            <div class="border-inner-thick">
                <div class="word-content">
                    <div class="top-spacer"></div>

                    <!-- NEW HEADER SECTION -->
                    <div class="header-section">
                        <div class="header-right">
                            <div>وزارة التعليم العالي</div>
                            <div>معهد مصر العالي للتجارة و الحاسبات</div>
                            <div>بالمنصورة</div>
                            <div style="font-weight: bold;">
                                شعبة <span id="headerSection"></span>
                            </div>
                        </div>
                        <div class="header-logo">
                            <img src="logo2.jpg" alt="Logo" width="80">
                        </div>
                    </div>

                    <div class="word-header" style="margin-bottom: 0px; font-size: 18pt;">
                        السيد الاستاذ الدكتور / <span id="pRecipientName">مصطفى محمد صالح</span>
                    </div>
                    <div class="word-header" style="margin-bottom: 20px; font-size: 18pt; margin-right: 350px;">
                        <span id="pRecipientTitle">وكيل المعهد</span>
                    </div>
                </div>

                <div class="word-header" style="text-align: center; margin-bottom: 30px;">
                    تحيه طيبه و بعد ،،،
                </div>

                <div class="request-main-text">
                    برجاء التكرم من سيادتكم بإضافة
                    <span class="variable-text" id="pBonus"></span>
                    درجات بونص لجميع طلاب
                    <span class="variable-text" id="pLevel"></span>
                    شعبة
                    <span class="variable-text" id="pSection"></span>
                    في اختبارات
                    <span class="variable-text" id="pExam"></span>
                    لمقرر
                    <span class="variable-text" id="pCourse"></span>
                    في العام الاكاديمي
                    <span class="variable-text" id="pYear"></span>.
                </div>

                <div class="signature-section">
                    <div class="signature-block">
                        مقدمه لسيادتكم<br>
                        <div style="margin-top: 10px;" id="pProf"></div>
                        <div style="margin-top: 10px;" id="pProf2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script>
        function convertDigitsToArabic(text) {
            if (text === null || text === undefined) return '';
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return text.toString().replace(/[0-9]/g, function (w) {
                return arabicDigits[+w];
            });
        }

        const form = document.getElementById('bonusForm');
        const wordPreview = document.getElementById('wordPreview');
        const inputView = document.querySelector('.input-view');
        const actionButtons = document.getElementById('actionButtons');

        // --- تحديث خيارات الفرقة بناءً على الشعبة المختارة ---
        function updateLevelOptions() {
            const section = document.getElementById('section').value;
            const levelSelect = document.getElementById('level');

            // الخيارات الافتراضية للفرق
            const defaultOptions = [
                { value: '', label: 'اختر الفرقة / المستوى', disabled: true, selected: true },
                { value: 'الفرقة الأولى', label: 'الفرقة الأولى' },
                { value: 'الفرقة الثانية', label: 'الفرقة الثانية' },
                { value: 'الفرقة الثالثة', label: 'الفرقة الثالثة' },
                { value: 'الفرقة الرابعة', label: 'الفرقة الرابعة' },
                { value: 'المستوى الأول', label: 'المستوى الأول' },
                { value: 'المستوى الثاني', label: 'المستوى الثاني' },
                { value: 'المستوى الثالث', label: 'المستوى الثالث' },
                { value: 'المستوى الرابع', label: 'المستوى الرابع' },
            ];

            // خيارات المحاسبة المعدلة
            const moadalOptions = [
                { value: '', label: 'اختر الفرقة / الشعبة', disabled: true, selected: true },
                { value: 'الفرقة الثالثة شعبة محاسبة', label: 'الفرقة الثالثة شعبة محاسبة' },
                { value: 'الفرقة الرابعة شعبة محاسبة', label: 'الفرقة الرابعة شعبة محاسبة' },
                { value: 'الفرقة الرابعة شعبة إدارة الأعمال', label: 'الفرقة الرابعة شعبة إدارة الأعمال' },
            ];

            // خيارات المحاسبة والمراجعة
            const murajaOptions = [
                { value: '', label: 'اختر الفرقة / الشعبة', disabled: true, selected: true },
                { value: 'الفرقة الأولى', label: 'الفرقة الأولى' },
                { value: 'الفرقة الثانية', label: 'الفرقة الثانية' },
                { value: 'الفرقة الثالثة شعبة محاسبة', label: 'الفرقة الثالثة شعبة محاسبة' },
                { value: 'الفرقة الثالثة شعبة إدارة الأعمال', label: 'الفرقة الثالثة شعبة إدارة الأعمال' },
                { value: 'الفرقة الرابعة شعبة محاسبة', label: 'الفرقة الرابعة شعبة محاسبة' },
                { value: 'الفرقة الرابعة شعبة إدارة الأعمال', label: 'الفرقة الرابعة شعبة إدارة الأعمال' },
            ];

            let opts;
            if (section === 'المحاسبة المعدلة') {
                opts = moadalOptions;
            } else if (section === 'المحاسبة والمراجعة') {
                opts = murajaOptions;
            } else {
                opts = defaultOptions;
            }

            // إعادة بناء القائمة
            levelSelect.innerHTML = '';
            opts.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt.value;
                o.textContent = opt.label;
                if (opt.disabled) o.disabled = true;
                if (opt.selected) o.selected = true;
                levelSelect.appendChild(o);
            });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const sectionVal = document.getElementById('section').value;
            const levelVal = document.getElementById('level').value;

            // تحديد ما إذا كان اختيار الفرقة يحتوي على شعبة مدمجة
            const accountingSections = ['المحاسبة المعدلة', 'المحاسبة والمراجعة'];
            const isCombined = accountingSections.includes(sectionVal);

            // Fill Data
            document.getElementById('pBonus').innerText = convertDigitsToArabic(document.getElementById('bonusDegrees').value);

            if (isCombined) {
                // الفرقة تحتوي على الفرقة + الشعبة معاً (مثل "الفرقة الثالثة شعبة محاسبة")
                // نفصل الجزء المشترك: كل شيء قبل كلمة "شعبة" هو الفرقة، وما بعدها هو الشعبة
                const shaabaIdx = levelVal.indexOf('شعبة');
                if (shaabaIdx !== -1) {
                    const levelPart = levelVal.substring(0, shaabaIdx).trim();
                    const sectionPart = levelVal.substring(shaabaIdx).trim(); // "شعبة ..."
                    document.getElementById('pLevel').innerText = convertDigitsToArabic(levelPart);
                    document.getElementById('pSection').innerText = convertDigitsToArabic(sectionPart.replace('شعبة ', ''));
                    document.getElementById('headerSection').innerText = convertDigitsToArabic(sectionVal);
                } else {
                    document.getElementById('pLevel').innerText = convertDigitsToArabic(levelVal);
                    document.getElementById('pSection').innerText = convertDigitsToArabic(sectionVal);
                    document.getElementById('headerSection').innerText = convertDigitsToArabic(sectionVal);
                }
            } else {
                document.getElementById('pLevel').innerText = convertDigitsToArabic(levelVal);
                document.getElementById('pSection').innerText = convertDigitsToArabic(sectionVal);
                document.getElementById('headerSection').innerText = convertDigitsToArabic(sectionVal);
            }

            const examSelect = document.getElementById('examType');
            document.getElementById('pExam').innerText = convertDigitsToArabic(examSelect.options[examSelect.selectedIndex].text);
            document.getElementById('pCourse').innerText = convertDigitsToArabic(document.getElementById('courseName').value);
            document.getElementById('pYear').innerText = convertDigitsToArabic(document.getElementById('academicYear').value);
            document.getElementById('pProf').innerText = convertDigitsToArabic(document.getElementById('profName').value);

            document.getElementById('pRecipientName').innerText = document.getElementById('recipientName').value;
            document.getElementById('pRecipientTitle').innerText = document.getElementById('recipientTitle').value;

            // Handle Optional Second Professor
            const prof2 = document.getElementById('profName2').value;
            if (prof2) {
                document.getElementById('pProf2').innerText = convertDigitsToArabic(prof2);
                document.getElementById('pProf2').style.display = 'block';
            } else {
                document.getElementById('pProf2').innerText = '';
                document.getElementById('pProf2').style.display = 'none';
            }

            // Switch View
            inputView.style.display = 'none';
            wordPreview.style.display = 'block';
            actionButtons.style.display = 'flex';
        });


        document.getElementById('printBtn').addEventListener('click', function () {
            window.print();
        });

        document.getElementById('backBtn').addEventListener('click', function () {
            inputView.style.display = 'block';
            wordPreview.style.setProperty('display', 'none');
            actionButtons.style.display = 'none';
        });

        document.getElementById('downloadWordBtn').addEventListener('click', function () {
            const courseName = document.getElementById('courseName').value || 'bonus-request';
            const profNameValue = document.getElementById('pProf').innerText;
            const prof2Value = document.getElementById('profName2').value;
            const recipientNameValue = document.getElementById('recipientName').value;
            const recipientTitleValue = document.getElementById('recipientTitle').value;
            const headerSectionText = document.getElementById('headerSection').innerText;

            const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset='utf-8'>
                <title>طلب بونص - ${courseName}</title>
                <style>
                    @page {
                        size: A4;
                        margin: 1.5cm;
                    }
                    body { 
                        font-family: 'Simplified Arabic', 'Traditional Arabic', serif; 
                        font-size: 16pt; 
                        font-weight: bold;
                        direction: rtl; 
                        text-align: right;
                        background-color: white;
                    }
                    .variable-text {
                        font-weight: bold;
                    }
                </style>
            </head>
            <body>`;

            // Header table with proper Word compatibility
            const headerTable = `
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 30px; direction: rtl;">
                <tr>
                    <td align="right" valign="top" style="font-family: 'Simplified Arabic', serif; font-size: 14pt; font-weight: bold; line-height: 1.4; text-align: center; width: 45%;">
                        وزارة التعليم العالي<br>
                        معهد مصر العالي للتجارة والحاسبات<br>
                        بالمنصورة<br>
                        شعبة <span style="text-decoration: underline;">${headerSectionText}</span>
                    </td>
                    <td width="10%">&nbsp;</td>
                    <td align="left" valign="top" style="width: 45%;">
                        <img src="logo2.jpg" width="90" height="auto" alt="Logo">
                    </td>
                </tr>
            </table>
            `;

            // Recipient Table
            const recipientTable = `
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 25px; direction: rtl;">
                <tr>
                    <td align="right" style="font-family: 'Simplified Arabic', serif; font-size: 18pt; font-weight: bold; line-height: 1.6;">
                        السيد الأستاذ الدكتور / ${recipientNameValue}
                    </td>
                </tr>
                <tr>
                    <td align="right" style="font-family: 'Simplified Arabic', serif; font-size: 18pt; font-weight: bold; padding-right: 250px; line-height: 1.6;">
                        ${recipientTitleValue}
                    </td>
                </tr>
            </table>
            `;

            // Signature Table
            const signatureTable = `
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 50px; direction: rtl;">
                <tr>
                    <td width="55%">&nbsp;</td>
                    <td width="45%" align="center" style="font-family: 'Simplified Arabic', serif; font-size: 18pt; font-weight: bold; line-height: 1.6;">
                        مقدمه لسيادتكم<br>
                        <span style="font-size: 16pt;">${profNameValue}</span>
                        ${prof2Value ? `<br><span style="font-size: 16pt;">${prof2Value}</span>` : ''}
                    </td>
                </tr>
            </table>
            `;

            // Document body inside double borders
            const documentBody = `
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border: 2px solid #000080; width: 100%;">
                <tr>
                    <td style="padding: 4px;">
                        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border: 4px solid #000080; width: 100%;">
                            <tr>
                                <td valign="top" align="right" style="padding: 30px 40px;">
                                    ${headerTable}
                                    
                                    ${recipientTable}
                                    
                                    <div style="font-family: 'Simplified Arabic', serif; font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 30px; width: 100%;">
                                        تحية طيبة وبعد ،،،
                                    </div>
                                    
                                    <p dir="rtl" style="font-family: 'Simplified Arabic', serif; font-size: 17pt; font-weight: bold; line-height: 1.8; text-align: justify; text-indent: 50px; margin-bottom: 30px; margin-top: 10px;">
                                        برجاء التكرم من سيادتكم بإضافة 
                                        <span class="variable-text">${document.getElementById('pBonus').innerText}</span> 
                                        درجات بونص لجميع طلاب 
                                        <span class="variable-text">${document.getElementById('pLevel').innerText}</span> 
                                        شعبة 
                                        <span class="variable-text">${document.getElementById('pSection').innerText}</span> 
                                        في اختبارات 
                                        <span class="variable-text">${document.getElementById('pExam').innerText}</span> 
                                        لمقرر 
                                        <span class="variable-text">${document.getElementById('pCourse').innerText}</span> 
                                        في العام الأكاديمي 
                                        <span class="variable-text">${document.getElementById('pYear').innerText}</span>.
                                    </p>
                                    
                                    ${signatureTable}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
            `;

            const postHtml = "</body></html>";
            const html = preHtml + documentBody + postHtml;

            const blob = new Blob(['\ufeff', html], {
                type: 'application/msword'
            });

            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);

            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);

            if (navigator.msSaveOrOpenBlob) {
                navigator.msSaveOrOpenBlob(blob, courseName + '.doc');
            } else {
                downloadLink.href = url;
                downloadLink.download = `طلـب بونـص - ${courseName}.doc`;
                downloadLink.click();
            }

            document.body.removeChild(downloadLink);
        });
    </script>
</body>

</html>
