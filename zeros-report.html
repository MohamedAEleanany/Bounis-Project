<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصر الأصفار — أعمال السنة</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .page-header {
            background: linear-gradient(135deg, #3d4451, #2c3040);
            color: white;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .page-header h4 {
            margin: 0;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 0.3px;
        }

        .main-container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem 3rem;
        }

        .report-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 1.5rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #fff5f5;
            border: 2px solid #f5c6cb;
            border-radius: 10px;
            padding: 0.8rem 1.4rem;
            text-align: center;
            flex: 1;
            min-width: 140px;
        }

        .stat-box .stat-num {
            font-size: 2rem;
            font-weight: 900;
            color: #dc3545;
            line-height: 1;
        }

        .stat-box .stat-label {
            font-size: 0.82rem;
            color: #6c757d;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .table {
            text-align: center;
            border-color: #dee2e6;
            font-size: 0.93rem;
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #f8f9fa;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            vertical-align: middle;
            padding: 0.6rem 0.5rem;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .table tbody td {
            vertical-align: middle;
            padding: 0.45rem 0.5rem;
        }

        .zero-val {
            font-weight: 700;
            color: #dc3545;
        }

        .written-val {
            font-weight: 700;
            color: #0d6efd;
        }

        .no-data-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #198754;
            font-size: 1rem;
            font-weight: 700;
            background: #f0fff4;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
        }

        .error-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #dc3545;
            font-size: 1rem;
            font-weight: 700;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .page-header {
                background: linear-gradient(135deg, #3d4451, #2c3040) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0.8rem 1.2rem;
            }
            .main-container { margin: 0; padding: 0; max-width: 100%; }
            .report-card { box-shadow: none; border: none; border-radius: 0; padding: 0.5rem; }
            .stats-row { display: none !important; }
            .table { font-size: 9pt; }
            .table thead th {
                background-color: #f8f9fa !important;
                color: #212529 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .print-only {
            display: none;
        }

        .print-subject {
            text-align: center;
            font-weight: 900;
            font-size: 1rem;
            padding: 0.4rem 0;
            border-bottom: 2px solid #dee2e6;
            margin-bottom: 0.8rem;
            color: #212529;
        }
    </style>
</head>

<body>

<div class="page-header no-print">
    <h4>حصر الأصفار — أعمال السنة (ابن الهيثم)</h4>
    <div class="d-flex gap-2">
        <button onclick="window.print()" class="btn btn-light fw-bold btn-sm">🖨️ طباعة</button>
        <a href="system-matching.html" class="btn btn-outline-light fw-bold btn-sm">← رجوع</a>
    </div>
</div>

<div class="main-container">
    <div class="report-card" id="report-card">
        <div class="print-only print-subject" id="print-subject-name"></div>
        <div class="text-center text-muted py-4">جاري تحميل البيانات...</div>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {
    var raw = sessionStorage.getItem('zerosData');
    var card = document.getElementById('report-card');

    if (!raw) {
        card.innerHTML = '<div class="error-msg">⚠️ لا توجد بيانات.<br>يرجى العودة وتشغيل المقارنة أولاً ثم الضغط على زر «حصر الأصفار».</div>';
        return;
    }

    var data;
    try { data = JSON.parse(raw); } catch (e) {
        card.innerHTML = '<div class="error-msg">❌ خطأ في قراءة البيانات.</div>';
        return;
    }

    var list = data.list || [];
    var subject = data.subject || '';

    // Set subject name for print
    var subjEl = document.getElementById('print-subject-name');
    if (subjEl && subject) subjEl.textContent = subject;

    if (list.length === 0) {
        document.getElementById('report-card').innerHTML =
            (subject ? '<div class="print-only print-subject">' + esc2(subject) + '</div>' : '') +
            '<div class="no-data-msg">لا يوجد طلاب بدرجة صفر في أعمال السنة</div>';
        return;
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function esc2(s) { return esc(s); }
    function safe(v) {
        var s = String(v).trim();
        return s === '' ? '—' : s;
    }

    var rows = '';
    list.forEach(function (z, idx) {
        rows += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><strong>' + esc(z.seat) + '</strong></td>' +
            '<td>' + esc(safe(z.qaid)) + '</td>' +
            '<td class="text-end">' + esc(z.name) + '</td>' +
            '<td><span class="zero-val">0</span></td>' +
            '<td class="written-val">' + esc(safe(z.written)) + '</td>' +
            '</tr>';
    });

    document.getElementById('report-card').innerHTML =
        '<div class="print-only print-subject">' + esc(subject) + '</div>' +
        '<div class="stats-row no-print">' +
            '<div class="stat-box">' +
                '<div class="stat-num">' + list.length + '</div>' +
                '<div class="stat-label">إجمالي الطلاب</div>' +
            '</div>' +
        '</div>' +
        '<div class="table-responsive">' +
        '<table class="table table-bordered table-sm table-hover">' +
        '<thead><tr>' +
            '<th style="width:45px">#</th>' +
            '<th>رقم الجلوس</th>' +
            '<th>حالة القيد</th>' +
            '<th>اسم الطالب</th>' +
            '<th>درجة الأنشطة</th>' +
            '<th>درجة التحريري</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table></div>';
});
</script>

</body>
</html>
