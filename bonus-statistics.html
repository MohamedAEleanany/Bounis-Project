<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإحصائيات الإجمالية</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Storage Helper -->
    <script src="storage-helper.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f5f5f5;
        }

        /* Results Styles */
        .result-view {
            padding: 2rem 0;
        }

        .result-section {
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            page-break-after: always;
        }

        .result-section:last-child {
            page-break-after: auto;
        }

        .course-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 2rem;
        }

        .stats-content {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .table-wrapper {
            flex: 0 0 auto;
            min-width: 300px;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .vertical-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vertical-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            padding: 1rem;
            border: 1px solid #dee2e6;
            text-align: right;
            width: 50%;
        }

        .vertical-table td {
            padding: 1rem;
            border: 1px solid #dee2e6;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #007bff;
        }

        .vertical-table th {
            font-weight: 700;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: landscape;
                margin: 1cm;
            }

            body {
                background-color: white;
                padding: 0;
            }

            .container {
                max-width: 100%;
                width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .result-section {
                margin: 0;
                padding: 1cm;
                border-radius: 0;
                page-break-after: always;
                page-break-inside: avoid;
            }

            .result-section:last-child {
                page-break-after: auto;
            }

            .course-title {
                font-size: 1.5rem;
                margin-bottom: 2rem;
            }

            .stats-content {
                gap: 1.5rem;
                margin-top: 1.5cm;
                align-items: center;
            }

            .table-wrapper {
                min-width: 450px;
            }

            .vertical-table th,
            .vertical-table td {
                padding: 1.2rem;
                font-size: 1.1rem;
                font-weight: bold;
                color: #000 !important;
            }

            .vertical-table th {
                background-color: #d3d3d3 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .chart-container {
                max-width: 280px;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
            background: white;
            border-radius: 10px;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <div id="results-view" class="result-view container">
        <div class="text-center no-print mb-4 mt-3">
            <button onclick="window.print()" class="btn btn-success me-2">
                🖨️ طباعة
            </button>
            <button onclick="goBack()" class="btn btn-secondary">
                ← العودة للنتائج
            </button>
        </div>

        <div id="results-container">
            <!-- سيتم ملء المحتوى هنا بواسطة JavaScript -->
        </div>

        <div class="text-center no-print mt-4 pb-5">
        </div>
    </div>

    <script>
        // استرجاع البيانات من safeStorage
        function loadStatistics() {
            const statsData = safeStorage.getItem('examStatistics');

            if (!statsData) {
                showEmptyState();
                return;
            }

            try {
                const results = JSON.parse(statsData);
                renderResults(results);
            } catch (error) {
                console.error('Error parsing statistics data:', error);
                showEmptyState();
            }
        }

        function renderResults(results) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                showEmptyState();
                return;
            }

            results.forEach((result, index) => {
                container.appendChild(createResultElement(result, index));
            });

            // رسم الـ Charts بعد إضافة العناصر للـ DOM
            setTimeout(() => {
                results.forEach((result, index) => {
                    createChart(result, index);
                });
            }, 100);
        }

        function createResultElement(result, index) {
            const section = document.createElement('div');
            section.className = 'result-section';
            section.id = `result-section-${index}`;

            // حساب نسبة النجاح بدون تقريب (القيمة الدقيقة)
            const successPercentage = result.attendingStudents > 0
                ? (result.currentPassStats.passed / result.attendingStudents) * 100
                : 0;

            const html = `
                <h4 class="course-title">${result.courseName}</h4>

                <div class="stats-content">
                    <div class="table-wrapper">
                        <table class="vertical-table">
                            <tbody>
                                <tr>
                                    <th>عدد الحضور</th>
                                    <td>${result.attendingStudents}</td>
                                </tr>
                                <tr>
                                    <th>عدد الغياب</th>
                                    <td>${result.absentStudents}</td>
                                </tr>
                                <tr>
                                    <th>عدد الناجحين</th>
                                    <td>${result.currentPassStats.passed}</td>
                                </tr>
                                <tr>
                                    <th>نسبة النجاح</th>
                                    <td style="color: #28a745; font-size: 1.3rem; direction: ltr;">%${successPercentage}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="chart-wrapper">
                        <div class="chart-container">
                            <canvas id="chart-${index}"></canvas>
                        </div>
                    </div>
                </div>
            `;

            section.innerHTML = html;
            return section;
        }

        function createChart(result, index) {
            if (typeof Chart === 'undefined') return;
            const successPercentage = result.attendingStudents > 0
                ? (result.currentPassStats.passed / result.attendingStudents) * 100
                : 0;

            const failPercentage = 100 - successPercentage;

            const ctx = document.getElementById(`chart-${index}`);
            if (!ctx) return;

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['نسبة النجاح', 'نسبة الرسوب'],
                    datasets: [{
                        data: [successPercentage, failPercentage],
                        backgroundColor: [
                            '#28a745',
                            '#dc3545'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    family: 'Cairo',
                                    size: 14,
                                    weight: 'bold'
                                },
                                padding: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return context.label + ': ' + context.parsed.toFixed(2) + '%';
                                }
                            },
                            titleFont: {
                                family: 'Cairo',
                                size: 14
                            },
                            bodyFont: {
                                family: 'Cairo',
                                size: 13
                            }
                        },
                        datalabels: {
                            display: true,
                            color: '#fff',
                            font: {
                                family: 'Cairo',
                                size: 20,
                                weight: 'bold'
                            },
                            formatter: function (value) {
                                return value.toFixed(1) + '%';
                            }
                        }
                    }
                },
                plugins: [{
                    id: 'centerText',
                    beforeDraw: function (chart) {
                        const width = chart.width;
                        const height = chart.height;
                        const ctx = chart.ctx;
                        ctx.restore();

                        const fontSize = (height / 114).toFixed(2);
                        ctx.font = `bold ${fontSize}em Cairo`;
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#28a745';

                        const text = successPercentage.toFixed(1) + '%';
                        const textX = Math.round((width - ctx.measureText(text).width) / 2);
                        const textY = height / 2;

                        ctx.fillText(text, textX, textY);
                        ctx.save();
                    }
                }]
            });
        }

        function showEmptyState() {
            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">📭</div>
                    <h3>لا توجد بيانات لعرضها</h3>
                    <p>يرجى تحليل الملفات أولاً من الصفحة الرئيسية</p>
                    <button onclick="goToHome()" class="btn btn-primary mt-3">
                        الذهاب للصفحة الرئيسية
                    </button>
                </div>
            `;
        }

        function goBack() {
            window.location.href = 'index.html?return=true';
        }

        function goToHome() {
            window.location.href = 'index.html';
        }

        // تحميل الإحصائيات عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadStatistics);
    </script>
</body>

</html>
