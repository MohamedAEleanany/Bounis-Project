<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النسبة بعد تطبيق البونص</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Storage Helper -->
    <script src="storage-helper.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f5f5f5;
        }

        /* Results Styles */
        .result-view {
            padding: 2rem 0;
        }

        .result-section {
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            page-break-after: always;
        }

        .result-section:last-child {
            page-break-after: auto;
        }

        .course-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 2rem;
        }

        .stats-content {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .table-wrapper {
            flex: 0 0 auto;
            min-width: 300px;
        }

        .chart-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .chart-wrapper-dual {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 2rem;
            min-height: 400px;
        }

        .vertical-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vertical-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            padding: 1rem;
            border: 1px solid #dee2e6;
            text-align: right;
            width: 50%;
        }

        .vertical-table td {
            padding: 1rem;
            border: 1px solid #dee2e6;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #007bff;
        }

        .vertical-table th {
            font-weight: 700;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        /* Print Styles */
        @media print {
            @page {
                size: landscape;
                margin: 0.5cm 0.8cm;
            }

            body {
                background-color: white;
                padding: 0;
            }

            .container {
                max-width: 100%;
                width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .result-section {
                margin: 0;
                padding: 0.2cm 0.4cm;
                border-radius: 0;
                page-break-inside: avoid;
                height: calc(100vh - 1cm);
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
            }

            .result-section:last-child {
                page-break-after: auto;
            }

            .course-title {
                font-size: 1.1rem;
                margin-bottom: 0.3rem;
                flex-shrink: 0;
                padding: 0.3rem 1rem;
                width: 100%;
                box-sizing: border-box;
            }

            .course-subject-highlight {
                background-color: #ffff00 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0.1rem 0.3rem;
            }

            .stats-content {
                gap: 1rem;
                margin-top: 0.3cm;
                align-items: stretch;
                flex: 1;
            }

            .table-wrapper {
                min-width: 350px;
                display: flex;
                flex-direction: column;
            }

            .vertical-table {
                flex: 1;
                height: 100%;
            }

            .vertical-table tbody {
                display: table;
                width: 100%;
                height: 100%;
            }

            .vertical-table tr {
                height: auto;
            }

            .vertical-table th,
            .vertical-table td {
                padding: 0.4rem 0.8rem;
                font-size: 1rem;
                font-weight: bold;
                color: #000 !important;
            }

            .vertical-table th {
                background-color: #d3d3d3 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .chart-container {
                max-width: 220px;
                page-break-inside: avoid;
            }

            .chart-wrapper-dual {
                gap: 0.5rem;
            }

            .chart-wrapper-dual .chart-container {
                max-width: 160px;
            }

            .chart-wrapper,
            .chart-wrapper-dual {
                page-break-inside: avoid;
            }

            /* ضمان طباعة الـ canvas بشكل صحيح */
            canvas {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                max-width: 100% !important;
                height: auto !important;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
            background: white;
            border-radius: 10px;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <div id="results-view" class="result-view container">
        <div class="text-center no-print mb-4 mt-3">
            <button onclick="printPage()" class="btn btn-success me-2">
                🖨️ طباعة
            </button>
            <button onclick="goBack()" class="btn btn-secondary">
                ← العودة للنتائج
            </button>
        </div>

        <div id="results-container">
            <!-- سيتم ملء المحتوى هنا بواسطة JavaScript -->
        </div>

        <div class="text-center no-print mt-4 pb-5">
        </div>
    </div>

    <script>
        // استرجاع البيانات من safeStorage
        function loadStatistics() {
            const statsData = safeStorage.getItem('examStatistics');

            if (!statsData) {
                showEmptyState();
                return;
            }

            try {
                const results = JSON.parse(statsData);
                renderResults(results);
            } catch (error) {
                console.error('Error parsing statistics data:', error);
                showEmptyState();
            }
        }

        function renderResults(results) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                showEmptyState();
                return;
            }

            results.forEach((result, index) => {
                container.appendChild(createResultElement(result, index));
            });

            // رسم الـ Charts بعد إضافة العناصر للـ DOM
            setTimeout(() => {
                results.forEach((result, index) => {
                    createChart(result, index);
                });
            }, 100);
        }

        function createResultElement(result, index) {
            const section = document.createElement('div');
            section.className = 'result-section';
            section.id = `result-section-${index}`;

            // استخدام درجة البونص من ملف Excel (J2)
            const bonusGradeFromExcel = result.bonusGrade || 0;

            // تحديد النص المعروض لدرجة البونص
            const bonusDisplayText = bonusGradeFromExcel === 0
                ? '<span style="color: #dc3545; font-weight: 700;">لا يوجد درجات بونص مضافة</span>'
                : `<span style="color: #ff6b6b;">${bonusGradeFromExcel}</span>`;

            // استخدام النسبة الأساسية (عند 50%)
            const successPercentage50 = result.attendingStudents > 0
                ? (result.currentPassStats.passed / result.attendingStudents) * 100
                : 0;

            // حساب نسبة النجاح عند 60% إذا كانت درجة الامتحان = 60
            let successPercentage60 = 0;
            let passedAt60 = 0;
            if (result.maxScore === 60) {
                const passThreshold60 = result.maxScore * 0.6;
                result.scores.forEach(score => {
                    if (parseFloat(score.toFixed(2)) >= parseFloat(passThreshold60.toFixed(2))) {
                        passedAt60++;
                    }
                });
                successPercentage60 = result.attendingStudents > 0
                    ? (passedAt60 / result.attendingStudents) * 100
                    : 0;
            }

            // بناء صف النسبة عند 60% إذا كانت الدرجة = 60
            const row60Html = result.maxScore === 60 ? `
                <tr>
                    <th>نسبة النجاح بعد تطبيق البونص عند 60%</th>
                    <td style="color: #007bff; font-size: 1.3rem; direction: ltr;">%${successPercentage60.toFixed(2)}</td>
                </tr>
            ` : '';

            // تحديد عرض الـ Charts
            const chartWrapperClass = result.maxScore === 60 ? 'chart-wrapper-dual' : 'chart-wrapper';
            const chartsHtml = result.maxScore === 60 ? `
                <div class="${chartWrapperClass}">
                    <div class="chart-container" style="max-width: 300px;">
                        <canvas id="chart-50-${index}"></canvas>
                        <p style="text-align: center; font-weight: 600; margin-top: 0.5rem;">نسبة النجاح عند 50%</p>
                        <p style="text-align: center; font-weight: 700; font-size: 1.2rem; color: #28a745; margin-top: 0.25rem;">${successPercentage50.toFixed(2)}%</p>
                    </div>
                    <div class="chart-container" style="max-width: 300px;">
                        <canvas id="chart-60-${index}"></canvas>
                        <p style="text-align: center; font-weight: 600; margin-top: 0.5rem;">نسبة النجاح عند 60%</p>
                        <p style="text-align: center; font-weight: 700; font-size: 1.2rem; color: #007bff; margin-top: 0.25rem;">${successPercentage60.toFixed(2)}%</p>
                    </div>
                </div>
            ` : `
                <div class="${chartWrapperClass}">
                    <div class="chart-container">
                        <canvas id="chart-${index}"></canvas>
                        <p style="text-align: center; font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.25rem;">نسبة النجاح عند 50%</p>
                        <p style="text-align: center; font-weight: 700; font-size: 1.2rem; color: #28a745; margin-top: 0;">${successPercentage50.toFixed(2)}%</p>
                    </div>
                </div>
            `;

            const parts = result.courseName.split(' - ');
            const courseTitleHtml = parts.length >= 2
                ? parts.map((p, i) => i === 1
                    ? `<span class="course-subject-highlight">${p}</span>`
                    : p).join(' - ')
                : result.courseName;

            const html = `
                <h4 class="course-title">${courseTitleHtml}</h4>
                <div style="text-align: center; margin-bottom: 1.5rem; margin-top: 1rem;">
                    <span style="display: inline-block; background: transparent; color: #000; padding: 0.5rem 1.5rem; border: 2px solid #000; border-radius: 5px; font-weight: 600; font-size: 1rem;">
                        بعد تطبيق البونص
                    </span>
                </div>
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <span style="font-weight: 600; font-size: 1.1rem; color: #333;">
                        درجة الامتحان: <span style="color: #007bff; font-weight: 700;">${result.maxScore}</span>
                    </span>
                </div>

                <div class="stats-content">
                    <div class="table-wrapper">
                        <table class="vertical-table">
                            <tbody>
                                <tr>
                                    <th>عدد الطلاب الكلي</th>
                                    <td>${result.attendingStudents + result.absentStudents}</td>
                                </tr>
                                <tr>
                                    <th>عدد الحضور</th>
                                    <td>${result.attendingStudents}</td>
                                </tr>
                                <tr>
                                    <th>عدد الغياب</th>
                                    <td>${result.absentStudents}</td>
                                </tr>
                                <tr>
                                    <th>عدد الناجحين</th>
                                    <td>${result.currentPassStats.passed}</td>
                                </tr>
                                <tr>
                                    <th>عدد الراسبين</th>
                                    <td>${result.attendingStudents - result.currentPassStats.passed}</td>
                                </tr>
                                <tr>
                                    <th>عدد درجات البونص</th>
                                    <td>${bonusDisplayText}</td>
                                </tr>
                                <tr>
                                    <th>نسبة النجاح بعد تطبيق البونص عند 50%</th>
                                    <td style="color: #28a745; font-size: 1.3rem; direction: ltr;">%${successPercentage50.toFixed(2)}</td>
                                </tr>
                                ${row60Html}
                            </tbody>
                        </table>
                    </div>

                    ${chartsHtml}
                </div>
            `;

            section.innerHTML = html;
            return section;
        }

        function createChart(result, index) {
            if (typeof Chart === 'undefined') return;
            if (result.maxScore === 60) {
                // رسم 2 Charts: واحد عند 50% وواحد عند 60%

                // Chart عند 50%
                const successPercentage50 = result.attendingStudents > 0
                    ? (result.currentPassStats.passed / result.attendingStudents) * 100
                    : 0;
                const failPercentage50 = 100 - successPercentage50;

                const ctx50 = document.getElementById(`chart-50-${index}`);
                if (ctx50) {
                    createSingleChart(ctx50, successPercentage50, failPercentage50);
                }

                // Chart عند 60%
                const passThreshold60 = result.maxScore * 0.6;
                let passedAt60 = 0;
                result.scores.forEach(score => {
                    if (parseFloat(score.toFixed(2)) >= parseFloat(passThreshold60.toFixed(2))) {
                        passedAt60++;
                    }
                });
                const successPercentage60 = result.attendingStudents > 0
                    ? (passedAt60 / result.attendingStudents) * 100
                    : 0;
                const failPercentage60 = 100 - successPercentage60;

                const ctx60 = document.getElementById(`chart-60-${index}`);
                if (ctx60) {
                    createSingleChart(ctx60, successPercentage60, failPercentage60);
                }
            } else {
                // رسم Chart واحد فقط
                const successPercentage = result.attendingStudents > 0
                    ? (result.currentPassStats.passed / result.attendingStudents) * 100
                    : 0;
                const failPercentage = 100 - successPercentage;

                const ctx = document.getElementById(`chart-${index}`);
                if (ctx) {
                    createSingleChart(ctx, successPercentage, failPercentage);
                }
            }
        }

        function createSingleChart(ctx, successPercentage, failPercentage) {
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['نسبة النجاح', 'نسبة السقوط'],
                    datasets: [{
                        data: [successPercentage, failPercentage],
                        backgroundColor: [
                            '#4472C4',
                            '#E61B1B'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    family: 'Cairo',
                                    size: 14,
                                    weight: 'bold'
                                },
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return context.label + ': ' + context.parsed.toFixed(1) + '%';
                                }
                            },
                            titleFont: {
                                family: 'Cairo',
                                size: 14
                            },
                            bodyFont: {
                                family: 'Cairo',
                                size: 13
                            }
                        },
                        datalabels: {
                            display: true,
                            color: '#fff',
                            font: {
                                family: 'Cairo',
                                size: 18,
                                weight: 'bold'
                            },
                            formatter: function (value) {
                                return value.toFixed(1) + '%';
                            }
                        }
                    }
                }
            });
        }

        function showEmptyState() {
            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">📭</div>
                    <h3>لا توجد بيانات لعرضها</h3>
                    <p>يرجى تحليل الملفات أولاً من الصفحة الرئيسية</p>
                    <button onclick="goToHome()" class="btn btn-primary mt-3">
                        الذهاب للصفحة الرئيسية
                    </button>
                </div>
            `;
        }

        function goBack() {
            window.location.href = 'index.html?return=true';
        }

        function goToHome() {
            window.location.href = 'index.html';
        }

        function printPage() {
            // إعادة رسم جميع الـ Charts لضمان ظهور الـ datalabels في الطباعة
            if (window.Chart && window.Chart.instances) {
                Object.values(window.Chart.instances).forEach(chart => {
                    if (chart && chart.update) {
                        chart.update();
                    }
                });
            }

            // إعطاء وقت للمتصفح لرسم الـ Charts قبل الطباعة
            setTimeout(function () {
                window.print();
            }, 800);
        }

        // تحميل الإحصائيات عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadStatistics);

        // إعادة رسم الـ Charts قبل الطباعة لضمان ظهورها
        window.addEventListener('beforeprint', function () {
            console.log('Preparing charts for printing...');
            // إعادة رسم جميع الـ Charts
            if (window.Chart && window.Chart.instances) {
                Object.values(window.Chart.instances).forEach(chart => {
                    if (chart && chart.update) {
                        chart.update();
                    }
                });
            }
        });
    </script>
</body>

</html>
