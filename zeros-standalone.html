<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصر الأصفار — أعمال السنة (ابن الهيثم)</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .page-header {
            background: linear-gradient(135deg, #3d4451, #2c3040);
            color: white;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .page-header h4 {
            margin: 0;
            font-weight: 900;
            font-size: 1.2rem;
        }

        /* Upload form */
        .upload-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 2rem;
            max-width: 600px;
            margin: 2.5rem auto;
        }

        .upload-card .form-label {
            font-weight: 700;
            color: #343a40;
        }

        .upload-card .group-desc {
            font-size: 0.83rem;
            color: #6c757d;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.6rem;
            border: 1px solid #e9ecef;
        }

        /* Results */
        .main-container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem 3rem;
        }

        .report-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 1.5rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #fff5f5;
            border: 2px solid #f5c6cb;
            border-radius: 10px;
            padding: 0.8rem 1.4rem;
            text-align: center;
            flex: 1;
            min-width: 140px;
        }

        .stat-box .stat-num {
            font-size: 2rem;
            font-weight: 900;
            color: #dc3545;
            line-height: 1;
        }

        .stat-box .stat-label {
            font-size: 0.82rem;
            color: #6c757d;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .table {
            text-align: center;
            border-color: #dee2e6;
            font-size: 0.93rem;
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #f8f9fa;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            vertical-align: middle;
            padding: 0.6rem 0.5rem;
        }

        .table tbody tr:hover { background-color: #f8f9fa; }

        .table tbody td {
            vertical-align: middle;
            padding: 0.45rem 0.5rem;
        }

        .zero-val { font-weight: 700; color: #dc3545; }
        .written-val { font-weight: 700; color: #0d6efd; }

        .no-data-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #198754;
            font-size: 1rem;
            font-weight: 700;
            background: #f0fff4;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
        }

        .error-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #dc3545;
            font-size: 1rem;
            font-weight: 700;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        /* Ibn desc box */
        #ibn-col-desc-box {
            font-size: 0.83rem;
            color: #6c757d;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.6rem;
            border: 1px solid #e9ecef;
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .page-header {
                background: linear-gradient(135deg, #3d4451, #2c3040) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0.8rem 1.2rem;
            }
            .main-container { margin: 0; padding: 0; max-width: 100%; }
            .report-card { box-shadow: none; border: none; border-radius: 0; padding: 0.5rem; }
            .stats-row { display: none !important; }
            .table { font-size: 9pt; }
            .table thead th {
                background-color: #f8f9fa !important;
                color: #212529 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .print-only { display: none; }

        .print-subject {
            text-align: center;
            font-weight: 900;
            font-size: 1rem;
            padding: 0.4rem 0;
            border-bottom: 2px solid #dee2e6;
            margin-bottom: 0.8rem;
            color: #212529;
        }
    </style>
</head>

<body>

<!-- Header -->
<div class="page-header no-print">
    <h4>حصر الأصفار — أعمال السنة (ابن الهيثم)</h4>
    <div class="d-flex gap-2">
        <button onclick="window.print()" class="btn btn-light fw-bold btn-sm" id="print-btn" style="display:none;">🖨️ طباعة</button>
        <a href="index.html" class="btn btn-outline-light fw-bold btn-sm">← رجوع</a>
    </div>
</div>

<!-- Upload form -->
<div id="upload-section">
    <div class="upload-card">
        <h5 class="fw-bold mb-4 text-center">حصر طلاب أعمال السنة صفر</h5>

        <!-- Curriculum selector -->
        <div class="mb-3">
            <label class="form-label" for="laee7a-select">اختر اللائحة الدراسية</label>
            <select class="form-select fw-bold" id="laee7a-select" onchange="onLaee7aChange()">
                <option value="new">لائحة جديدة</option>
                <option value="old-theory">لائحة قديمة — نظري فقط (25-75)</option>
                <option value="old-practical">لائحة قديمة — عملي (25-65-10)</option>
            </select>
        </div>

        <!-- Year level (new curriculum only) -->
        <div class="mb-3" id="year-level-group">
            <label class="form-label" for="year-level-select">🎓 الفرقة الدراسية</label>
            <select class="form-select fw-bold" id="year-level-select" onchange="onLaee7aChange()">
                <option value="first">الفرقة الأولى</option>
                <option value="other">الفرقة الثانية</option>
                <option value="other">الفرقة الثالثة</option>
                <option value="other">الفرقة الرابعة</option>
            </select>
        </div>

        <hr>

        <!-- Ibn Haytham file -->
        <div class="mb-3">
            <label class="form-label">③ ملف ابن الهيثم</label>
            <div id="ibn-col-desc-box"></div>
            <input type="file" class="form-control" id="file-ibnhaytham" accept=".xlsx,.xls" onchange="onFileChange()">
            <div id="file-status" class="mt-1 text-muted small"></div>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-danger fw-bold" id="run-btn" onclick="runReport()" disabled>
                عرض الأصفار
            </button>
        </div>
    </div>
</div>

<!-- Results -->
<div class="main-container" id="results-section" style="display:none;">
    <div class="no-print d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-secondary fw-bold btn-sm" onclick="resetToUpload()">← تغيير الملف</button>
        <button class="btn btn-success fw-bold btn-sm" onclick="window.print()">🖨️ طباعة</button>
    </div>
    <div class="report-card" id="report-card">
        <div class="print-only print-subject" id="print-subject-name"></div>
        <div class="text-center text-muted py-4">جاري تحميل البيانات...</div>
    </div>
</div>

<script>
// =============================================
//  COLUMN CONSTANTS
// =============================================
var COL = { A:0, B:1, C:2, D:3, E:4, F:5, G:6, H:7, I:8, J:9, K:10 };

var dataIbn = null;

function cell(row, idx) {
    if (!row || row[idx] === undefined || row[idx] === null) return '';
    return String(row[idx]).trim();
}

function normId(s) {
    return String(s).trim().replace(/\s+/g, '');
}

// =============================================
//  UI HELPERS
// =============================================
function onLaee7aChange() {
    var laee7a = document.getElementById('laee7a-select').value;
    var yearLevel = document.getElementById('year-level-select').value;

    // Show/hide year level
    document.getElementById('year-level-group').style.display = (laee7a === 'new') ? 'block' : 'none';

    // Update ibn desc
    var descBox = document.getElementById('ibn-col-desc-box');
    if (laee7a === 'new') {
        var isFirst = (yearLevel === 'first');
        if (isFirst) {
            descBox.innerHTML = 'عمود A = رقم الجلوس &nbsp;|&nbsp; عمود B = حالة القيد &nbsp;|&nbsp; عمود D = اسم الطالب &nbsp;|&nbsp; <strong>عمود E = أعمال السنة</strong> &nbsp;|&nbsp; <strong>عمود F = التحريري</strong> &nbsp;|&nbsp; عمود G = ميد ترم<br>يبدأ الحساب من الصف الثالث';
        } else {
            descBox.innerHTML = 'عمود A = رقم الجلوس &nbsp;|&nbsp; عمود B = حالة القيد &nbsp;|&nbsp; عمود D = اسم الطالب &nbsp;|&nbsp; <strong>عمود E = أعمال السنة</strong> &nbsp;|&nbsp; عمود F = ميد ترم &nbsp;|&nbsp; <strong>عمود G = التحريري</strong><br>يبدأ الحساب من الصف الثالث';
        }
    } else if (laee7a === 'old-theory') {
        descBox.innerHTML = 'عمود A = رقم الجلوس &nbsp;|&nbsp; عمود B = حالة القيد &nbsp;|&nbsp; عمود D = اسم الطالب &nbsp;|&nbsp; <strong>عمود E = أعمال السنة + ميد ترم</strong> &nbsp;|&nbsp; <strong>عمود F = التحريري</strong><br>يبدأ الحساب من الصف الثالث';
    } else {
        descBox.innerHTML = 'عمود A = رقم الجلوس &nbsp;|&nbsp; عمود B = حالة القيد &nbsp;|&nbsp; عمود D = اسم الطالب &nbsp;|&nbsp; <strong>عمود E = أعمال السنة</strong> &nbsp;|&nbsp; <strong>عمود F = العملي</strong> &nbsp;|&nbsp; <strong>عمود G = التحريري</strong><br>يبدأ الحساب من الصف الثالث';
    }
}

function onFileChange() {
    var f = document.getElementById('file-ibnhaytham').files[0];
    var statusEl = document.getElementById('file-status');
    var runBtn = document.getElementById('run-btn');

    if (!f) { dataIbn = null; runBtn.disabled = true; statusEl.textContent = ''; return; }

    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var wb = XLSX.read(e.target.result, { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            dataIbn = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            var count = Math.max(0, dataIbn.length - 2);
            statusEl.textContent = '✓ تم التحميل — ' + count + ' طالب';
            statusEl.className = 'mt-1 text-success small fw-bold';
            runBtn.disabled = false;
        } catch (err) {
            statusEl.textContent = '❌ خطأ في قراءة الملف';
            statusEl.className = 'mt-1 text-danger small fw-bold';
            dataIbn = null;
            runBtn.disabled = true;
        }
    };
    reader.readAsArrayBuffer(f);
}

function resetToUpload() {
    dataIbn = null;
    document.getElementById('file-ibnhaytham').value = '';
    document.getElementById('file-status').textContent = '';
    document.getElementById('run-btn').disabled = true;
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('upload-section').style.display = 'block';
    document.getElementById('print-btn').style.display = 'none';
}

// =============================================
//  MAIN REPORT LOGIC
// =============================================
function runReport() {
    if (!dataIbn) { alert('يرجى رفع ملف ابن الهيثم أولاً'); return; }

    var laee7a   = document.getElementById('laee7a-select').value;
    var yearLevel = document.getElementById('year-level-select').value;

    // Determine written column based on curriculum
    var ibnWrittenCol;
    if (laee7a === 'new') {
        ibnWrittenCol = (yearLevel === 'first') ? COL.F : COL.G;
    } else if (laee7a === 'old-theory') {
        ibnWrittenCol = COL.F;
    } else { // old-practical
        ibnWrittenCol = COL.G;
    }

    // اسم المادة من الصف الأول عمود E
    var subjectName = '';
    if (dataIbn.length > 0) {
        var rawSubject = String(dataIbn[0][COL.E] || '').trim();
        // اعكس الترتيب: خذ الجزء بعد آخر "-" كاسم المادة
        if (rawSubject.indexOf('-') !== -1) {
            subjectName = rawSubject.split('-').pop().trim();
        } else {
            subjectName = rawSubject;
        }
    }

    // Parse ibn haytham rows (from index 2)
    var zerosList = [];
    for (var i = 2; i < dataIbn.length; i++) {
        var r = dataIbn[i];
        var seat = normId(cell(r, COL.A));
        if (!seat) continue;
        var yearwork = cell(r, COL.E); // أعمال السنة always col E
        var written  = cell(r, ibnWrittenCol);
        var qaid     = cell(r, COL.B);
        var name     = cell(r, COL.D);
        var yw = parseFloat(String(yearwork).trim());
        if (!isNaN(yw) && yw === 0) {
            zerosList.push({ seat: seat, qaid: qaid, name: name, yearwork: yearwork, written: written });
        }
    }

    renderReport(zerosList, subjectName);
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function safe(v) {
    var s = String(v).trim();
    return s === '' ? '—' : s;
}

function renderReport(list, subject) {
    var card = document.getElementById('report-card');

    // Show results section
    document.getElementById('upload-section').style.display = 'none';
    document.getElementById('results-section').style.display = 'block';
    document.getElementById('print-btn').style.display = 'inline-block';

    // Set print subject name
    var subjEl = document.getElementById('print-subject-name');
    if (subjEl) subjEl.textContent = subject || 'حصر الأصفار';

    if (list.length === 0) {
        card.innerHTML =
            '<div class="print-only print-subject">' + esc(subject || '') + '</div>' +
            '<div class="no-data-msg">لا يوجد طلاب بدرجة صفر في أعمال السنة</div>';
        return;
    }

    var rows = '';
    list.forEach(function(z, idx) {
        rows += '<tr>' +
            '<td>' + (idx + 1) + '</td>' +
            '<td><strong>' + esc(z.seat) + '</strong></td>' +
            '<td>' + esc(safe(z.qaid)) + '</td>' +
            '<td class="text-end">' + esc(z.name) + '</td>' +
            '<td><span class="zero-val">0</span></td>' +
            '<td class="written-val">' + esc(safe(z.written)) + '</td>' +
            '</tr>';
    });

    card.innerHTML =
        '<div class="print-only print-subject">' + esc(subject || 'حصر الأصفار') + '</div>' +
        '<div class="stats-row no-print">' +
            '<div class="stat-box">' +
                '<div class="stat-num">' + list.length + '</div>' +
                '<div class="stat-label">إجمالي الطلاب</div>' +
            '</div>' +
        '</div>' +
        '<div class="table-responsive">' +
        '<table class="table table-bordered table-sm table-hover">' +
        '<thead><tr>' +
            '<th style="width:45px">#</th>' +
            '<th>رقم الجلوس</th>' +
            '<th>حالة القيد</th>' +
            '<th>اسم الطالب</th>' +
            '<th>درجة الأنشطة</th>' +
            '<th>درجة التحريري</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table></div>';
}

// Init descriptions on load
window.addEventListener('DOMContentLoaded', function() {
    onLaee7aChange();
});
</script>

</body>
</html>
