<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درجات الطلاب</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Storage Helper -->
    <script src="storage-helper.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f5f5f5;
        }

        .result-view {
            padding: 2rem 0;
        }

        .result-section {
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            page-break-after: always;
        }

        .result-section:last-child {
            page-break-after: auto;
        }

        .course-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 2rem;
        }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
        }

        .grades-table th {
            background-color: #f8f9fa;
            font-weight: 700;
            padding: 0.8rem;
            border: 1px solid #dee2e6;
            text-align: center;
            font-size: 0.9rem;
        }

        .grades-table td {
            padding: 0.8rem;
            border: 1px solid #dee2e6;
            text-align: center;
            font-weight: 600;
        }

        .student-name {
            text-align: right !important;
            font-weight: 700;
        }

        /* Print Styles */
        @media print {
            @page {
                size: portrait;
                margin: 1cm 1cm 1cm 1.5cm;
            }

            body {
                background-color: white;
                padding: 0;
            }

            .container {
                max-width: 100%;
                width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .result-section {
                margin: 0;
                padding: 0.5cm;
                border-radius: 0;
                page-break-after: always;
            }

            .table-responsive {
                overflow: visible !important;
            }

            .result-section:last-child {
                page-break-after: auto;
            }

            .course-title {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .grades-table th {
                background-color: #d3d3d3 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: #000 !important;
                font-size: 0.65rem;
                padding: 0.5rem;
            }

            .grades-table td {
                color: #000 !important;
                font-weight: bold;
                font-size: 0.65rem;
                padding: 0.5rem;
            }

            .student-name {
                white-space: nowrap !important;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
            background: white;
            border-radius: 10px;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <div id="results-view" class="result-view container">
        <div class="text-center no-print mb-4 mt-3">
            <button onclick="window.print()" class="btn btn-success me-2">
                🖨️ طباعة
            </button>
            <button onclick="goBack()" class="btn btn-secondary">
                ← العودة للنتائج
            </button>
        </div>

        <!-- Filter Section -->
        <div class="no-print mb-4" style="max-width: 500px; margin: 0 auto;">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title mb-3">🔍 تصفية حسب الدرجة</h6>
                    <div class="input-group">
                        <input type="text" id="gradeFilter" class="form-control"
                            placeholder="أدخل الدرجة أو الدرجات (مثال: 30, 35, 40)">
                        <button class="btn btn-primary" onclick="filterByGrade()">تصفية</button>
                        <button class="btn btn-outline-secondary" onclick="clearFilter()">إلغاء التصفية</button>
                    </div>
                    <small class="text-muted d-block mt-2">يمكنك إدخال درجة واحدة أو عدة درجات مفصولة بفاصلة (,)</small>
                </div>
            </div>
        </div>

        <div id="results-container">
            <!-- سيتم ملء المحتوى هنا بواسطة JavaScript -->
        </div>

        <div class="text-center no-print mt-4 pb-5">
        </div>
    </div>

    <script>
        // استرجاع البيانات من safeStorage
        function loadStudentGrades() {
            const statsData = safeStorage.getItem('examStatistics');

            if (!statsData) {
                showEmptyState();
                return;
            }

            try {
                const results = JSON.parse(statsData);
                allResults = results; // حفظ البيانات الأصلية
                renderResults(results);
            } catch (error) {
                console.error('Error parsing statistics data:', error);
                showEmptyState();
            }
        }

        function renderResults(results, isFiltered = false) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                showEmptyState();
                return;
            }

            results.forEach((result, index) => {
                if (isFiltered) {
                    container.appendChild(createSimpleResultElement(result, index));
                } else {
                    container.appendChild(createResultElement(result, index));
                }
            });
        }

        function createSimpleResultElement(result, index) {
            const section = document.createElement('div');
            section.className = 'result-section';
            section.id = `result-section-${index}`;

            // إنشاء جدول مبسط (اسم الطالب والدرجة فقط)
            let tableRowsHTML = '';
            if (result.scores && result.scores.length > 0) {
                result.scores.forEach((score, studentIndex) => {
                    const studentName = result.studentNames && result.studentNames[studentIndex]
                        ? result.studentNames[studentIndex]
                        : `طالب ${studentIndex + 1}`;

                    tableRowsHTML += `
                        <tr>
                            <td>${studentIndex + 1}</td>
                            <td class="student-name">${studentName}</td>
                            <td style="font-weight: 700; color: #007bff;">${score}</td>
                        </tr>
                    `;
                });
            } else {
                tableRowsHTML = `
                    <tr>
                        <td colspan="3" style="text-align: center; color: #6c757d;">لا يوجد طلاب بهذه الدرجة</td>
                    </tr>
                `;
            }

            const html = `
                <h4 class="course-title">${result.courseName}</h4>
                <div class="alert alert-info text-center">
                    الطلاب الحاصلين على درجة ${result.filterGrade || currentFilterGrades[0]}
                </div>

                <div class="table-responsive">
                    <table class="grades-table">
                        <thead>
                            <tr>
                                <th style="width: 10%;">#</th>
                                <th style="width: 60%;">اسم الطالب</th>
                                <th style="width: 30%;">الدرجة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHTML}
                        </tbody>
                    </table>
                </div>
            `;

            section.innerHTML = html;
            return section;
        }

        function createResultElement(result, index) {
            const section = document.createElement('div');
            section.className = 'result-section';
            section.id = `result-section-${index}`;

            // إنشاء رأس الجدول
            let tableHeaderHTML = `
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 25%;">اسم الطالب</th>
                    <th>الدرجة</th>
            `;

            // تحديد الحد الأقصى للدرجات المضافة من البيانات
            const maxAddedGrades = result.curveData && result.curveData.length > 0
                ? result.curveData[result.curveData.length - 1].added
                : 10;

            // إضافة أعمدة بعد +1 حتى الحد الأقصى
            for (let i = 1; i <= maxAddedGrades; i++) {
                tableHeaderHTML += `<th>بعد +${i}</th>`;
            }
            tableHeaderHTML += `</tr>`;

            // إنشاء صفوف الطلاب
            let tableRowsHTML = '';
            if (result.scores && result.scores.length > 0) {
                result.scores.forEach((score, studentIndex) => {
                    // استخدام اسم الطالب الحقيقي من البيانات أو اسم افتراضي
                    const studentName = result.studentNames && result.studentNames[studentIndex]
                        ? result.studentNames[studentIndex]
                        : `طالب ${studentIndex + 1}`;

                    tableRowsHTML += `
                        <tr>
                            <td>${studentIndex + 1}</td>
                            <td class="student-name">${studentName}</td>
                            <td style="font-weight: 700; color: #007bff;">${score}</td>
                    `;

                    // فحص إذا كانت الدرجة الأساسية = الدرجة القصوى
                    if (score >= result.maxScore) {
                        // دمج جميع الخلايا
                        tableRowsHTML += `<td colspan="${maxAddedGrades}" style="background-color: #28a745; color: white; font-weight: bold; text-align: center;">درجة الطالب وصلت للحد الأقصى</td>`;
                    } else {
                        // إضافة الدرجات بعد الإضافة
                        let reachedMax = false;
                        for (let i = 1; i <= maxAddedGrades; i++) {
                            const newScore = score + i;

                            if (newScore >= result.maxScore && !reachedMax) {
                                // أول مرة يصل للحد الأقصى
                                tableRowsHTML += `<td style="font-weight: 700; color: #28a745;">${result.maxScore}</td>`;
                                reachedMax = true;
                            } else if (reachedMax) {
                                // بعد ما وصل للحد الأقصى، الخلايا المتبقية صفراء
                                tableRowsHTML += `<td style="background-color: #ffc107; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></td>`;
                            } else {
                                // لسه ما وصلش للحد الأقصى
                                tableRowsHTML += `<td>${newScore}</td>`;
                            }
                        }
                    }

                    tableRowsHTML += `</tr>`;
                });
            }

            const html = `
                <h4 class="course-title">${result.courseName}</h4>

                <div class="table-responsive">
                    <table class="grades-table">
                        <thead>
                            ${tableHeaderHTML}
                        </thead>
                        <tbody>
                            ${tableRowsHTML}
                        </tbody>
                    </table>
                </div>
            `;

            section.innerHTML = html;
            return section;
        }

        function showEmptyState() {
            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">📭</div>
                    <h3>لا توجد بيانات لعرضها</h3>
                    <p>يرجى تحليل الملفات أولاً من الصفحة الرئيسية</p>
                    <button onclick="goToHome()" class="btn btn-primary mt-3">
                        الذهاب للصفحة الرئيسية
                    </button>
                </div>
            `;
        }

        function goBack() {
            window.location.href = 'index.html?return=true';
        }

        function goToHome() {
            window.location.href = 'index.html';
        }

        // متغير لحفظ البيانات الأصلية
        let allResults = [];
        let currentFilterGrades = []; // تغيير من grade واحد إلى array

        function filterByGrade() {
            const filterInput = document.getElementById('gradeFilter');
            const filterValue = filterInput.value.trim();

            if (!filterValue) {
                alert('الرجاء إدخال درجة أو درجات للتصفية');
                return;
            }

            // تحليل الدرجات المدخلة (مفصولة بفاصلة)
            const gradesArray = filterValue.split(',').map(g => parseFloat(g.trim())).filter(g => !isNaN(g) && g >= 0);

            if (gradesArray.length === 0) {
                alert('الرجاء إدخال درجات صحيحة');
                return;
            }

            currentFilterGrades = gradesArray;
            renderFilteredResults();
        }

        function clearFilter() {
            currentFilterGrades = [];
            document.getElementById('gradeFilter').value = '';
            renderResults(allResults);
        }

        function renderFilteredResults() {
            if (!allResults || allResults.length === 0) {
                return;
            }

            const container = document.getElementById('results-container');
            container.innerHTML = '';

            // لكل مادة
            allResults.forEach((result, resultIndex) => {
                // لكل درجة في الفلتر
                currentFilterGrades.forEach((grade, gradeIndex) => {
                    // تصفية الطلاب حسب الدرجة الحالية
                    const filteredScores = [];
                    const filteredNames = [];

                    result.scores.forEach((score, index) => {
                        if (score === grade) {
                            filteredScores.push(score);
                            filteredNames.push(result.studentNames[index]);
                        }
                    });

                    // إنشاء نسخة من النتيجة مع الطلاب المصفاة
                    const filteredResult = {
                        ...result,
                        scores: filteredScores,
                        studentNames: filteredNames,
                        filterGrade: grade // حفظ الدرجة المصفاة
                    };

                    // إضافة الجدول للـ container
                    container.appendChild(createSimpleResultElement(filteredResult, `${resultIndex}-${gradeIndex}`));
                });
            });
        }

        // تحميل درجات الطلاب عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadStudentGrades);
    </script>
</body>

</html>
